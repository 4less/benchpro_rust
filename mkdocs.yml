site_name: Benchpro
site_description: Benchpro CLI documentation
repo_url: https://github.com/4less/benchpro_rust
repo_name: benchpro_rust
site_url: https://4less.github.io/benchpro_rust/

nav:
  - Overview: index.md
  - Installation: installation.md
  - Usage: usage.md
  - Input Formats: input-formats.md
  - Metrics and Adjustments: metrics.md

theme:
  name: material
  features:
    - navigation.expand
    - navigation.sections
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
