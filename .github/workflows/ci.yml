# Runs on every pull request and every push to main. Branch protection on
# main requires the `test` job to pass before a pull request can be merged.
#
# Nightly, because src/main.rs uses #![feature(...)].
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test --locked
